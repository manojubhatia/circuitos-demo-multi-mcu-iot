name: Build Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-firmware:
    name: Build All Firmware Targets
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.1.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build theSpeaker (esp32)
        run: |
          . /opt/esp/idf/export.sh
          cd device_theSpeaker
          idf.py set-target esp32
          idf.py build

      - name: Build environment (esp32c3)
        run: |
          . /opt/esp/idf/export.sh
          cd device_environment
          idf.py set-target esp32c3
          idf.py build

      - name: Build motor_n_mike (esp32c3)
        run: |
          . /opt/esp/idf/export.sh
          cd device_motor_n_mike
          idf.py set-target esp32c3
          idf.py build


  check-backend:
    name: Check Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Syntax check
        run: |
          cd backend
          python -m py_compile main.py
